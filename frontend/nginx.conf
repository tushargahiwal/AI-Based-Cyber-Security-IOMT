server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite fingerprints its asset filenames, so they can be cached hard; the
    # entry HTML must not be, or a deploy leaves browsers on the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/v1 {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The live monitor's feed is a WebSocket on this same prefix. Without the
        # upgrade headers the handshake is proxied as plain HTTP and fails.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A simulation can stream for minutes; the default 60s read timeout
        # would drop the socket mid-run.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # React Router owns the paths, so anything that is not a real file becomes
    # index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
